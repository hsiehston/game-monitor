version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: gamedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

  crawler:
    build: ./crawler
    restart: unless-stopped
    environment:
      DB_URL: postgresql://monitor:yourpassword@db:5432/gamedb
    depends_on:
      - db

volumes:
  postgres_data:
