services:
  postgres:
    image: postgres:16-alpine
    container_name: game-monitor-db
    environment:
      POSTGRES_DB: game_monitor
      POSTGRES_USER: game_monitor
      POSTGRES_PASSWORD: game_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_monitor -d game_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  crawler:
    build:
      context: ./crawler
    container_name: game-monitor-crawler
    environment:
      DATABASE_URL: postgresql://game_monitor:game_monitor@postgres:5432/game_monitor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
